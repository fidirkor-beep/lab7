{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Архив статей</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}" />
</head>
<body class="archive">
    <a class="all-posts-link" href="{% url 'register' %}">Регистрация</a>

    <div class="header">
        <img src="{% static 'logo.png' %}" />
    </div>
    <div class="archive">
        {% for post in posts %}
        <div class="one-post">
            <h2 class="post-title">
		<a href="{% url 'get_article' post.id %}">{{ post.title }}</a>
	</h2>
		<button class="fold-button">свернуть</button>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <p class="article-text">{{ post.get_excerpt }}</p>
        </div>
        {% endfor %}
    </div>
<script src="{% static 'js/fold-post.js' %}"></script>
</body>
</html>
